name: Build DLP_Kriva EXE

on:
  push:
    branches: [ kriva-agent-exe ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ps2exe
        shell: powershell
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force

      - name: Build DLP_Kriva.exe
        shell: powershell
        run: |
          Import-Module ps2exe
          $ico = if (Test-Path .\kriva-logo.ico) { '.\kriva-logo.ico' } else { $null }
          if ($ico) { Invoke-ps2exe .\dlp-agent.ps1 .\DLP_Kriva.exe -noConsole -iconFile $ico -title 'DLP_Kriva' -company 'Kriva Infosys' -product 'Kriva DLP' }
          else      { Invoke-ps2exe .\dlp-agent.ps1 .\DLP_Kriva.exe -noConsole -title 'DLP_Kriva' -company 'Kriva Infosys' -product 'Kriva DLP' }
          if (-not (Test-Path .\DLP_Kriva.exe)) { throw 'EXE not built' }
          Write-Host 'DLP_Kriva.exe ban gayi.'

      - name: Upload EXE (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: DLP_Kriva-exe
          path: DLP_Kriva.exe
          if-no-files-found: error

      - name: Publish EXE to exe-out branch (for direct pull)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cp DLP_Kriva.exe out/DLP_Kriva.exe
          git config user.name "kriva-ci"
          git config user.email "ci@kriva.local"
          git checkout --orphan exe-out
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f out/DLP_Kriva.exe
          git commit -m "DLP_Kriva.exe build $(date -u +%Y%m%d-%H%M%S)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" exe-out
